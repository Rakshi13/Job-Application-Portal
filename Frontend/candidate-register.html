<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidate Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

</head>

<body class="bg-light">

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold text-primary fs-3" href="index.html">
                JobPortal
            </a>

            <div class="ms-auto">

                <a href="login.html" class="btn btn-outline-primary">
                    Login
                </a>

            </div>

        </div>

    </nav>

    <!-- Registration Form -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">
                                Candidate Registration
                            </h2>

                            <p class="text-secondary">
                                Create your account and start applying for jobs.
                            </p>

                        </div>

                        <form id="candidateForm">

                            <div class="mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input type="text" id="candidate-username" class="form-control form-control-lg"
                                    placeholder="Choose Username" required>
                                <div class="text-danger small" id="username-error"></div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password" id="candidate-password" class="form-control form-control-lg"
                                    placeholder="Password" required>
                                <div class="text-danger small" id="password-error"></div>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password" id="candidate-confirm-password"
                                    class="form-control form-control-lg" placeholder="Confirm Password" required>

                                <div class="text-danger small" id="confirm-password-error"></div>

                            </div>

                            <div class="d-grid">

                                <button type="submit" class="btn btn-primary btn-lg" id="register-candidate">

                                    Register as Candidate

                                </button>

                            </div>

                        </form>

                        <hr class="my-4">

                        <div class="text-center">

                            <p>

                                Looking to Hire?

                                <a href="employer-register.html">
                                    Register as Employer
                                </a>

                            </p>

                            <p>

                                Already have an account?

                                <a href="login.html">
                                    Login
                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="/js/candidate-register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
