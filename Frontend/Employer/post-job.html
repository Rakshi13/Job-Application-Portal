<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="employer-dashboard.html">

                JobPortal

            </a>


            <button class="btn btn-light btn-sm" id="logoutBtn">

                Logout

            </button>

        </div>

    </nav>



    <!-- Post Job -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4">


                        <h2 class="fw-bold mb-4">
                            Post a New Job
                        </h2>


                        <form id="postJobForm">


                            <!-- Job Title -->

                            <div class="mb-3">

                                <label for="title" class="form-label">

                                    Job Title

                                </label>

                                <input type="text" class="form-control" id="title" placeholder="Enter job title"
                                    required>

                            </div>



                            <!-- Job Description -->

                            <div class="mb-3">

                                <label for="description" class="form-label">

                                    Job Description

                                </label>

                                <textarea class="form-control" id="description" rows="5"
                                    placeholder="Enter job description" required></textarea>

                            </div>



                            <!-- Location -->

                            <div class="mb-3">

                                <label for="location" class="form-label">

                                    Location

                                </label>

                                <input type="text" class="form-control" id="location" placeholder="Enter job location"
                                    required>

                            </div>



                            <!-- Salary -->

                            <div class="row">


                                <!-- Minimum Salary -->

                                <div class="col-md-6 mb-3">

                                    <label for="minSalary" class="form-label">

                                        Minimum Salary

                                    </label>

                                    <input type="number" class="form-control" id="minSalary"
                                        placeholder="Enter minimum salary" min="0" required>

                                </div>



                                <!-- Maximum Salary -->

                                <div class="col-md-6 mb-3">

                                    <label for="maxSalary" class="form-label">

                                        Maximum Salary

                                    </label>

                                    <input type="number" class="form-control" id="maxSalary"
                                        placeholder="Enter maximum salary" min="0" required>

                                </div>

                            </div>



                            <!-- Error Message -->

                            <div id="errorMessage" class="alert alert-danger d-none">
                            </div>



                            <!-- Buttons -->

                            <div class="d-flex gap-2">

                                <button type="button" class="btn btn-secondary"
                                    onclick="window.location.href='employer-dashboard.html'">

                                    Cancel

                                </button>


                                <button type="submit" class="btn btn-primary" id="postJobBtn">

                                    Post Job

                                </button>

                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="post-job.js"></script>

</body>

</html>
