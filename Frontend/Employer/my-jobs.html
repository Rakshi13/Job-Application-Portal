<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Jobs</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="employer-dashboard.html">

                JobPortal

            </a>


            <div class="d-flex gap-2">

                <a
                    href="employer-dashboard.html"
                    class="btn btn-light btn-sm">

                    Dashboard

                </a>


                <button
                    class="btn btn-light btn-sm"
                    id="logoutBtn">

                    Logout

                </button>

            </div>

        </div>

    </nav>



    <!-- Main Content -->

    <div class="container mt-5">


        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold mb-1">
                    My Jobs
                </h2>

                <p class="text-muted mb-0">
                    Manage all jobs posted by your company.
                </p>

            </div>


            <a
                href="post-job.html"
                class="btn btn-primary">

                + Post New Job

            </a>

        </div>



        <!-- Jobs Card -->

        <div class="card shadow-sm">


            <div class="card-body">


                <!-- Loading -->

                <div
                    id="loadingMessage"
                    class="text-center py-5">

                    <div
                        class="spinner-border text-primary"
                        role="status">
                    </div>

                    <p class="mt-3 text-muted">
                        Loading jobs...
                    </p>

                </div>



                <!-- Error -->

                <div
                    id="errorMessage"
                    class="alert alert-danger d-none">
                </div>



                <!-- No Jobs -->

                <div
                    id="noJobsMessage"
                    class="text-center py-5 d-none">

                    <h5>
                        No jobs found
                    </h5>

                    <p class="text-muted">
                        You haven't posted any jobs yet.
                    </p>

                    <a
                        href="post-job.html"
                        class="btn btn-primary">

                        Post Your First Job

                    </a>

                </div>



                <!-- Jobs Table -->

                <div
                    id="jobsTableContainer"
                    class="table-responsive d-none">

                    <table
                        class="table table-hover align-middle mb-0">


                        <thead class="table-light">

                            <tr>

                                <th>
                                    Job Title
                                </th>

                                <th>
                                    Location
                                </th>

                                <th>
                                    Min Salary
                                </th>

                                <th>
                                    Max Salary
                                </th>

                                <th class="text-center">
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="jobsTableBody">

                        </tbody>


                    </table>

                </div>


            </div>

        </div>



        <!-- Pagination -->

        <div
            id="paginationContainer"
            class="d-flex justify-content-center mt-4 d-none">

            <nav>

                <ul class="pagination">

                    <li class="page-item">

                        <a
                            class="page-link"
                            href="#">

                            Previous

                        </a>

                    </li>


                    <li class="page-item active">

                        <a
                            class="page-link"
                            href="#">

                            1

                        </a>

                    </li>


                    <li class="page-item">

                        <a
                            class="page-link"
                            href="#">

                            2

                        </a>

                    </li>


                    <li class="page-item">

                        <a
                            class="page-link"
                            href="#">

                            3

                        </a>

                    </li>


                    <li class="page-item">

                        <a
                            class="page-link"
                            href="#">

                            Next

                        </a>

                    </li>

                </ul>

            </nav>

        </div>


    </div>



    <script src="my-jobs.js"></script>

</body>

</html>
