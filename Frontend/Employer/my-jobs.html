<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Jobs - JobPortal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="employer-dashboard.html">

                JobPortal

            </a>

            <button class="btn btn-light btn-sm" id="logoutBtn">

                Logout

            </button>

        </div>

    </nav>



    <!-- Main Content -->

    <div class="container mt-5">


        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    My Jobs
                </h2>

                <p class="text-muted mb-0">
                    Manage the jobs posted by your company.
                </p>

            </div>


            <a href="post-job.html" class="btn btn-primary">

                + Post New Job

            </a>

        </div>



        <!-- Error Message -->

        <div id="errorMessage" class="alert alert-danger d-none">

        </div>



        <!-- Success Message -->

        <div id="successMessage" class="alert alert-success d-none">

        </div>



        <!-- Jobs Table -->

        <div class="card shadow-sm">

            <div class="card-body">


                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                            <tr>

                                <th>ID</th>

                                <th>Job Title</th>

                                <th>Location</th>

                                <th>Min Salary</th>

                                <th>Max Salary</th>

                                <th>Actions</th>

                            </tr>

                        </thead>


                        <tbody id="jobsTableBody">

                            <!-- Jobs will be loaded here -->

                        </tbody>

                    </table>

                </div>



                <!-- No Jobs Message -->

                <div id="noJobsMessage" class="text-center text-muted py-4 d-none">

                    No jobs found.

                </div>


            </div>

        </div>


    </div>



    <script src="my-jobs.js"></script>

</body>

</html>
