<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Candidate Profile | Job Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="edit-candidate-profile.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="candidate-dashboard.html">
                <i class="bi bi-briefcase-fill me-2"></i>JobPortal
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="candidate-dashboard.html" class="nav-link text-white">
                    <i class="bi bi-grid me-1"></i> Dashboard
                </a>

                <button id="logoutBtn" class="btn btn-light">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container profile-container">

        <div class="page-heading">
            <a href="candidate-profile.html" class="back-link text-decoration-none">
                <i class="bi bi-arrow-left me-2"></i>Back to Profile
            </a>

            <h1 class="mt-3">Edit Profile</h1>
            <p class="text-secondary">
                Keep your personal and professional information up to date.
            </p>
        </div>

        <!-- Loading -->
        <div id="loadingBox" class="loading-box">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3">Loading your profile...</p>
        </div>

        <!-- Messages -->
        <div id="messageBox" class="alert d-none" role="alert"></div>

        <!-- Form -->
        <section id="formContainer" class="form-card d-none">
            <div class="form-heading">
                <div class="form-icon">
                    <i class="bi bi-person-lines-fill"></i>
                </div>
                <div>
                    <h2>Personal Information</h2>
                    <p class="text-secondary mb-0">
                        Update the details below and save your changes.
                    </p>
                </div>
            </div>

            <form id="editProfileForm">
                <div class="row g-4">

                    <!-- Full Name -->
                    <div class="col-md-6">
                        <label for="fullName" class="form-label">
                            Full Name <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name"
                            maxlength="100" required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            Email <span class="required">*</span>
                        </label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>

                    <!-- Phone Number -->
                    <div class="col-md-6">
                        <label for="phoneNo" class="form-label">
                            Phone Number <span class="required">*</span>
                        </label>
                        <input type="tel" class="form-control" id="phoneNo" placeholder="Enter your phone number"
                            maxlength="15" required>
                    </div>

                    <!-- Location -->
                    <div class="col-md-6">
                        <label for="location" class="form-label">
                            Location <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" id="location" placeholder="City, State" required>
                    </div>

                    <!-- Current Designation -->
                    <div class="col-md-6">
                        <label for="currentDesignation" class="form-label">
                            Current Designation
                        </label>
                        <input type="text" class="form-control" id="currentDesignation"
                            placeholder="e.g. Java Developer">
                    </div>

                    <!-- Experience -->
                    <div class="col-md-6">
                        <label for="experience" class="form-label">
                            Experience (Years) <span class="required">*</span>
                        </label>
                        <input type="number" class="form-control" id="experience" placeholder="e.g. 4" min="0" step="1"
                            required>
                    </div>

                    <!-- Skills -->
                    <div class="col-12">
                        <label for="skills" class="form-label">
                            Skills <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" id="skills"
                            placeholder="e.g. Java, Spring Boot, SQL, REST APIs" required>
                        <div class="form-text">
                            Separate each skill with a comma.
                        </div>
                    </div>

                    <!-- Professional Summary -->
                    <div class="col-12">
                        <label for="professionalSummary" class="form-label">
                            Professional Summary
                        </label>
                        <textarea class="form-control" id="professionalSummary" rows="5" maxlength="1000"
                            placeholder="Write a brief summary of your experience and career goals..."></textarea>
                        <div class="form-text text-end">
                            <span id="summaryCount">0</span>/1000
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="form-actions">
                    <a href="candidate-profile.html" class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit" id="saveBtn" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>Save Changes
                    </button>
                </div>
            </form>
        </section>

    </main>

    <script src="edit-candidate-profile.js"></script>
</body>

</html>
