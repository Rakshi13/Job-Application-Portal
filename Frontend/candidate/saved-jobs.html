<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                JobPortal
            </a>

            <a href="candidate-dashboard.html" class="btn btn-light">
                Dashboard
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <h2 class="mb-4">My Saved Jobs</h2>

        <div id="message" class="mb-3"></div>

        <!-- Saved Jobs will be displayed here -->
        <div class="row" id="savedJobsContainer">
        </div>

    </div>

    <script>
        const API_URL = "https://job-application-portal-ke3u.onrender.com/jobs/savedjobs";

        // Get JWT token from localStorage
        const token = localStorage.getItem("token");

        // Fetch all saved jobs
        async function getSavedJobs() {

            const container =
                document.getElementById("savedJobsContainer");

            const message =
                document.getElementById("message");

            if (!token) {
                message.innerHTML = `
                    <div class="alert alert-warning">
                        Please login to view your saved jobs.
                    </div>
                `;
                return;
            }

            try {
                message.innerHTML = `
                    <p>Loading saved jobs...</p>
                `;

                const response = await fetch(API_URL, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                if (response.status === 401) {
                    throw new Error("Session expired. Please login again.");
                }

                if (response.status === 403) {
                    throw new Error("You are not authorized to view saved jobs.");
                }

                if (!response.ok) {
                    throw new Error("Failed to fetch saved jobs.");
                }

                const savedJobs = await response.json();

                container.innerHTML = "";
                message.innerHTML = "";

                // Check if candidate has saved any jobs
                if (!Array.isArray(savedJobs) || savedJobs.length === 0) {
                    message.innerHTML = `
                        <div class="alert alert-info">
                            You have not saved any jobs yet.
                        </div>
                    `;
                    return;
                }

                // Display each saved job
                savedJobs.forEach(job => {

                    const card = document.createElement("div");
                    card.className = "col-md-6 col-lg-4 mb-4";

                    const minSalary = job.minSalary != null
                        ? Number(job.minSalary).toLocaleString("en-IN")
                        : "Not specified";

                    const maxSalary = job.maxSalary != null
                        ? Number(job.maxSalary).toLocaleString("en-IN")
                        : "Not specified";

                    card.innerHTML = `
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">

                                <h5 class="card-title">
                                    ${escapeHTML(job.title)}
                                </h5>

                                <h6 class="text-primary mb-3">
                                    ${escapeHTML(job.companyName)}
                                </h6>

                                <p class="card-text">
                                    <strong>Location:</strong>
                                    ${escapeHTML(job.location)}
                                </p>

                                <p class="card-text">
                                    <strong>Description:</strong>
                                    ${escapeHTML(job.description)}
                                </p>

                                <p class="card-text">
                                    <strong>Salary:</strong>
                                    ₹${minSalary} - ₹${maxSalary}
                                </p>

                                <span class="badge bg-success">
                                    Saved Job
                                </span>

                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                message.innerHTML = `
                    <div class="alert alert-danger">
                        ${escapeHTML(error.message)}
                    </div>
                `;
            }
        }

        // Escape API data before inserting it into HTML
        function escapeHTML(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        // Call API when page loads
        getSavedJobs();

    </script>

</body>

</html>
